name: Build LuttzzGrox Native APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libtinfo6 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install --user --upgrade Cython==0.29.33 virtualenv
          pip install buildozer

      - name: Build APK with Buildozer
        run: |
          export PATH=$PATH:~/.local/bin
          yes | buildozer android debug 2>&1 | tee buildozer_log.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LuttzzGrox-Native-APK
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload Build Logs (Jika Gagal)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-error-log
          path: buildozer_log.txt
